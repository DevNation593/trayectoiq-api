# pnpm 10 no ejecuta scripts de instalacion de dependencias salvo los listados aqui.
onlyBuiltDependencies:
  - '@nestjs/core'
  - '@prisma/engines'
  - '@swc/core'
  - esbuild
  - prisma

# Dependencias transitivas de la CLI de Prisma 7.10.0 con avisos de seguridad.
# Ninguna se ejecuta en la API (no se usa MySQL; @prisma/config solo corre en la CLI),
# pero se fuerzan a versiones corregidas para que "pnpm audit" siga siendo una senal util.
# Revisar y quitar al actualizar Prisma.
overrides:
  deepmerge-ts: ^8.0.0 # GHSA-ggr8-5vv4-36mx
  mysql2: ^3.23.1 # GHSA-3f6p-5ww8-9rcr, GHSA-rgwj-5xj2-c3m3
