# Entorno local. Credenciales solo para desarrollo.
#
#   docker compose up -d postgres mailpit   -> dependencias; la API corre en el host con "pnpm start:dev"
#   docker compose up --build               -> todo en contenedores: postgres, mailpit, migraciones y API en :3000
#   docker compose --profile geo up -d      -> ademas, rutas (Valhalla :8002) y direcciones (Photon :2322).
#                                              La primera vez descarga el extracto de Ecuador y construye indices:
#                                              varios minutos y ~1.5 GB entre imagenes y datos.
name: trayectoiq

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: trayectoiq
      POSTGRES_PASSWORD: trayectoiq
      POSTGRES_DB: trayectoiq
    ports:
      - '15432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U trayectoiq -d trayectoiq']
      interval: 3s
      timeout: 3s
      retries: 20

  mailpit:
    image: axllent/mailpit
    ports:
      - '8025:8025' # interfaz web
      - '1025:1025' # SMTP

  # Las migraciones corren como job, no al arrancar la API (DEVELOPMENT_GUIDE.md).
  migrate:
    build:
      context: .
      target: build
    command: ['pnpm', 'exec', 'prisma', 'migrate', 'deploy']
    environment:
      DATABASE_URL: postgresql://trayectoiq:trayectoiq@postgres:5432/trayectoiq
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build:
      context: .
      target: runtime
    environment:
      NODE_ENV: development
      PORT: '3000'
      DATABASE_URL: postgresql://trayectoiq:trayectoiq@postgres:5432/trayectoiq
      # Secretos solo para desarrollo local.
      JWT_ACCESS_SECRET: dev-only-access-secret-0123456789abcdef
      JWT_REFRESH_PEPPER: dev-only-refresh-pepper-fedcba9876543210
      SMTP_URL: smtp://mailpit:1025
    ports:
      - '3000:3000'
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/health/ready').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 10

  # Motor de rutas sobre OpenStreetMap (ADR-005). Descarga el extracto de Ecuador y construye las teselas
  # en el primer arranque; despues reutiliza el volumen. No se publica a internet: solo lo usa la API.
  valhalla:
    image: ghcr.io/valhalla/valhalla-scripted:latest
    profiles: ['geo']
    environment:
      tile_urls: https://download.geofabrik.de/south-america/ecuador-latest.osm.pbf
      build_elevation: 'False'
      build_admins: 'True'
      build_time_zones: 'True'
      serve_tiles: 'True'
    ports:
      - '8002:8002'
    volumes:
      - valhalla_data:/custom_files

  # Geocoder con autocompletado sobre OpenStreetMap (ADR-005). No hay indice precompilado de Ecuador:
  # docker/photon/entrypoint.sh lo construye desde el volcado oficial en el primer arranque.
  photon:
    image: rtuszik/photon-docker:latest
    profiles: ['geo']
    entrypoint: ['sh', '/tiq/entrypoint.sh']
    ports:
      - '2322:2322'
    volumes:
      - photon_data:/photon/data
      - ./docker/photon:/tiq:ro

volumes:
  pgdata:
  valhalla_data:
  photon_data:
