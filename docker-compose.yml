# Entorno local. Credenciales solo para desarrollo.
#
#   docker compose up -d postgres mailpit   -> dependencias; la API corre en el host con "pnpm start:dev"
#   docker compose up --build               -> todo en contenedores: postgres, mailpit, migraciones y API en :3000
name: trayectoiq

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: trayectoiq
      POSTGRES_PASSWORD: trayectoiq
      POSTGRES_DB: trayectoiq
    ports:
      - '15432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U trayectoiq -d trayectoiq']
      interval: 3s
      timeout: 3s
      retries: 20

  mailpit:
    image: axllent/mailpit
    ports:
      - '8025:8025' # interfaz web
      - '1025:1025' # SMTP

  # Las migraciones corren como job, no al arrancar la API (DEVELOPMENT_GUIDE.md).
  migrate:
    build:
      context: .
      target: build
    command: ['pnpm', 'exec', 'prisma', 'migrate', 'deploy']
    environment:
      DATABASE_URL: postgresql://trayectoiq:trayectoiq@postgres:5432/trayectoiq
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build:
      context: .
      target: runtime
    environment:
      NODE_ENV: development
      PORT: '3000'
      DATABASE_URL: postgresql://trayectoiq:trayectoiq@postgres:5432/trayectoiq
    ports:
      - '3000:3000'
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/health/ready').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
